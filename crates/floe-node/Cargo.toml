[package]
name = "floe-node"
version = "0.1.0"
edition.workspace = true

[features]
default = []
allocator-mimalloc = ["dep:mimalloc"]
allocator-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
floe-executor = { path = "../floe-executor" }
floe-node-core = { path = "../floe-node-core" }
floe-config = { path = "../floe-config" }
floe-server = { path = "../floe-server" }
floe-storage = { path = "../floe-storage" }
floe-core = { path = "../floe-core" }
floe-cdc = { path = "../floe-cdc" }
floe-cdc-core = { path = "../floe-cdc-core" }
floe-cdc-pg = { path = "../floe-cdc-pg" }
dbsp = { path = "../dbsp" }
anyhow = { workspace = true }
bytes = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
datafusion = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
floe-sql-parser = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
rdkafka = { workspace = true }
rayon = { workspace = true }
slatedb = { workspace = true }
prometheus = { workspace = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
arrow-buffer = "57.1.0"
arrow-data = "57.1.0"
tempfile = "3.10"
tower = "0.5"
serial_test = "3"
