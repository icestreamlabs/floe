[workspace]
members = [
    "crates/floe-node",
    "crates/floe-core",
    "crates/floe-executor",
    "crates/floe-storage",
    "crates/dbsp",
    "crates/floe-sql-parser",
]
default-members = ["crates/floe-node"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
async-recursion = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
datafusion = "50.2.0"
datafusion-common = "50.2.0"
futures = "0.3"
nexmark = { version = "0.2.0", features = ["serde"] }
object_store = "0.12.4"
pgwire = { version = "0.33.0", default-features = false, features = ["server-api"] }
rkyv = "0.8.12"
arrow-schema = "56.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slatedb = { version = "0.8.2", default-features = false }
sqlparser = "0.58"
tokio = { version = "1.38", features = ["full"] }
floe-sql-parser = { path = "crates/floe-sql-parser" }
